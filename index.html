<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stream Viewer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --text-dim: #7d8590;
        --green: #3fb950;
        --red: #f85149;
        --yellow: #d29922;
        --blue: #58a6ff;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* ─── Header ──────────────────────────── */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 20px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }

      .header h1 {
        font-size: 18px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
        background: var(--text-dim);
        transition: background 0.3s;
      }
      .status-dot.streaming {
        background: var(--green);
        box-shadow: 0 0 8px var(--green);
      }
      .status-dot.scanning,
      .status-dot.connecting {
        background: var(--yellow);
        animation: pulse 1s infinite;
      }
      .status-dot.error {
        background: var(--red);
        animation: pulse 0.5s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      .header-info {
        display: flex;
        gap: 20px;
        font-size: 13px;
        color: var(--text-dim);
      }

      .header-info span {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .header-info .val {
        color: var(--text);
        font-variant-numeric: tabular-nums;
      }

      /* ─── Stream ──────────────────────────── */
      .stream-wrap {
        flex: 1;
        position: relative;
        overflow: hidden;
      }

      #stream {
        border-radius: 0;
        background: #000;
        display: block;
      }

      /* Режимы отображения */
      .view-fit #stream {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: fill; /* деформирует под экран */
      }
      .view-fill #stream {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover; /* обрезает края, без полос */
      }
      .view-contain #stream {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain; /* чёрные полосы, без деформации */
      }
      .view-original #stream {
        position: static;
        width: auto;
        height: auto;
        max-width: none;
        max-height: none;
        object-fit: none; /* 1:1 пиксели */
      }

      /* ─── Overlay (когда нет потока) ──────── */
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(13, 17, 23, 0.92);
        z-index: 10;
        transition: opacity 0.4s;
        pointer-events: none;
      }
      .overlay.hidden {
        opacity: 0;
      }

      .overlay-icon {
        font-size: 48px;
        margin-bottom: 16px;
      }

      .overlay h2 {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .overlay p {
        color: var(--text-dim);
        font-size: 14px;
        text-align: center;
        max-width: 400px;
        line-height: 1.5;
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid var(--border);
        border-top-color: var(--blue);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ─── Footer ──────────────────────────── */
      .footer {
        padding: 8px 20px;
        background: var(--surface);
        border-top: 1px solid var(--border);
        font-size: 12px;
        color: var(--text-dim);
        display: flex;
        justify-content: space-between;
        flex-shrink: 0;
      }

      .footer a {
        color: var(--blue);
        text-decoration: none;
      }

      /* ─── Controls ────────────────────────── */
      .controls {
        display: flex;
        gap: 8px;
      }

      .btn {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 5px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        transition: background 0.2s;
      }
      .btn:hover {
        background: var(--border);
      }

      /* ─── Log panel ───────────────────────── */
      .log-panel {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s;
        background: var(--surface);
        border-top: 1px solid var(--border);
      }
      .log-panel.open {
        max-height: 200px;
      }

      .log-content {
        padding: 10px 20px;
        font-family: "Cascadia Code", "Fira Code", monospace;
        font-size: 12px;
        color: var(--text-dim);
        overflow-y: auto;
        max-height: 180px;
        line-height: 1.6;
      }

      .log-content .log-error {
        color: var(--red);
      }
      .log-content .log-ok {
        color: var(--green);
      }
      .log-content .log-warn {
        color: var(--yellow);
      }

      /* ─── Responsive ──────────────────────── */
      @media (max-width: 600px) {
        .header {
          flex-direction: column;
          gap: 8px;
        }
        .header-info {
          gap: 12px;
          font-size: 12px;
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>
        <span class="status-dot" id="statusDot"></span>
        <span>Stream Viewer</span>
        <span
          id="statusText"
          style="font-weight: 400; font-size: 13px; color: var(--text-dim)"
        ></span>
      </h1>
      <div class="header-info">
        <span>IP: <b class="val" id="camIp">—</b></span>
        <span>FPS: <b class="val" id="camFps">—</b></span>
        <span>Разрешение: <b class="val" id="camRes">—</b></span>
        <span>Аптайм: <b class="val" id="camUptime">—</b></span>
        <span>Кадров: <b class="val" id="camFrames">—</b></span>
      </div>
      <div class="controls">
        <button
          class="btn"
          onclick="takeSnapshot()"
          title="Скачать текущий кадр"
        >
          📷 Снимок
        </button>
        <button class="btn" onclick="toggleFullscreen()" title="Полный экран">
          ⛶ Экран
        </button>
        <button class="btn" onclick="toggleLog()" title="Показать лог">
          📋 Лог
        </button>
        <select
          class="btn"
          id="viewMode"
          onchange="setViewMode(this.value)"
          title="Режим отображения"
        >
          <option value="fit" selected>↔ Вписать</option>
          <option value="contain">🔲 Пропорционально</option>
          <option value="fill">🔳 Заполнить</option>
          <option value="original">🔍 Оригинал</option>
        </select>
        <select
          class="btn"
          id="camMode"
          onchange="setCamMode(this.value)"
          title="Кадр: все/верх/низ"
        >
          <option value="full" selected>📷 Весь кадр</option>
          <option value="top">⬆ Верх (камера верх)</option>
          <option value="bottom">⬇ Низ (камера низ)</option>
        </select>
      </div>
    </div>

    <div class="stream-wrap view-fit" id="streamWrap">
      <img id="stream" alt="Camera stream" />
      <div class="overlay" id="overlay">
        <div class="spinner" id="overlaySpinner"></div>
        <h2 id="overlayTitle">Подключение...</h2>
        <p id="overlayText">Ожидание потока с камеры</p>
      </div>
    </div>

    <div class="log-panel" id="logPanel">
      <div class="log-content" id="logContent"></div>
    </div>

    <div class="footer">
      <span id="footerStatus">Инициализация...</span>
      <span
        >Stream Viewer v1.1 · <a href="/status" target="_blank">/status</a> ·
        <a href="/snapshot" target="_blank">/snapshot</a></span
      >
    </div>

    <script>
      // ─── Конфигурация ────────────────────────────────────────────────────────────
      const STATUS_POLL_MS = 2000; // Опрос /status
      const STREAM_RECONNECT_MS = 5000; // Задержка переподключения потока
      const MAX_LOG = 100; // Макс строк в логе

      // ─── Элементы ────────────────────────────────────────────────────────────────
      const streamImg = document.getElementById("stream");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayText = document.getElementById("overlayText");
      const overlaySpinner = document.getElementById("overlaySpinner");
      const statusDot = document.getElementById("statusDot");
      const statusText = document.getElementById("statusText");
      const camIp = document.getElementById("camIp");
      const camFps = document.getElementById("camFps");
      const camRes = document.getElementById("camRes");
      const camUptime = document.getElementById("camUptime");
      const camFrames = document.getElementById("camFrames");
      const footerStatus = document.getElementById("footerStatus");
      const logContent = document.getElementById("logContent");
      const logPanel = document.getElementById("logPanel");

      let lastStatus = "init";
      let streamConnected = false;
      let reconnectTimer = null;
      let currentCamMode = "full";

      // Health check: /status.frame_count должен расти.
      let lastFrameCount = -1;
      let lastFrameTickMs = Date.now();
      let lastHealthWarnMs = 0;

      // ─── Логирование ─────────────────────────────────────────────────────────────
      /**
       * Добавляет строку в нижнюю панель лога.
       * @param {string} msg Сообщение для пользователя.
       * @param {string} [level=""] Уровень подсветки: error, ok или warn.
       * @returns {void}
       */
      function addLog(msg, level = "") {
        const time = new Date().toLocaleTimeString("ru-RU");
        const cls =
          level === "error"
            ? "log-error"
            : level === "ok"
              ? "log-ok"
              : level === "warn"
                ? "log-warn"
                : "";
        const div = document.createElement("div");
        div.className = cls;
        div.textContent = `[${time}] ${msg}`;
        logContent.appendChild(div);
        // Ограничиваем размер DOM, чтобы долгий просмотр не раздувал страницу.
        while (logContent.children.length > MAX_LOG) {
          logContent.removeChild(logContent.firstChild);
        }
        logContent.scrollTop = logContent.scrollHeight;
      }

      // ─── Статус ──────────────────────────────────────────────────────────────────
      /**
       * Форматирует аптайм сервера для компактного отображения.
       * @param {number} seconds Аптайм в секундах.
       * @returns {string} Строка в формате HH:MM:SS.
       */
      function formatUptime(seconds) {
        if (!seconds) return "—";
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = seconds % 60;
        return `${h.toString().padStart(2, "0")}:${m.toString().padStart(2, "0")}:${s.toString().padStart(2, "0")}`;
      }

      /**
       * Запрашивает статус backend-а и синхронизирует UI с состоянием потока.
       * @returns {Promise<void>}
       */
      async function pollStatus() {
        try {
          const resp = await fetch("/status", {
            signal: AbortSignal.timeout(3000),
          });
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();

          // Обновляем UI
          statusDot.className = "status-dot " + data.status;
          camIp.textContent = data.camera_ip || "—";
          camFps.textContent = data.fps > 0 ? data.fps : "—";
          camRes.textContent = data.resolution || "—";
          camUptime.textContent = formatUptime(data.uptime_seconds);
          camFrames.textContent =
            data.frame_count > 0 ? data.frame_count.toLocaleString() : "—";

          // ─── Stream health: если кадры не меняются, форсим переподключение ──
          if (typeof data.frame_count === "number") {
            if (lastFrameCount === -1) {
              lastFrameCount = data.frame_count;
              lastFrameTickMs = Date.now();
            } else if (data.frame_count > lastFrameCount) {
              lastFrameCount = data.frame_count;
              lastFrameTickMs = Date.now();
            } else if (data.frame_count < lastFrameCount) {
              // Сервер перезапустился (счётчик сбросился)
              lastFrameCount = data.frame_count;
              lastFrameTickMs = Date.now();
              if (data.status === "streaming") {
                streamConnected = false;
                streamStarting = false;
                startStream();
              }
            }

            const noFramesMs = Date.now() - lastFrameTickMs;
            if (data.status === "streaming" && noFramesMs > 8000) {
              // Важно: onerror у MJPEG <img> может не сработать при рестарте бэка,
              // поэтому используем frame_count как источник истины.
              if (Date.now() - lastHealthWarnMs > 15000) {
                addLog("Поток завис (кадры не обновляются) — переподключаю...", "warn");
                lastHealthWarnMs = Date.now();
              }
              streamConnected = false;
              streamStarting = false;
              if (reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
              }
              startStream();
            }
          }

          const statusLabels = {
            init: "Инициализация",
            scanning: "Поиск камеры...",
            connecting: "Подключение...",
            streaming: "Трансляция",
            error: "Ошибка",
          };
          statusText.textContent =
            "· " + (statusLabels[data.status] || data.status);
          footerStatus.textContent =
            data.status === "streaming"
              ? `Трансляция · ${data.camera_ip} · ${data.resolution} · ${data.fps} fps`
              : data.error || statusLabels[data.status] || data.status;

          // Логируем смену статуса
          if (data.status !== lastStatus) {
            if (data.status === "streaming") {
              addLog(`Трансляция запущена (${data.camera_ip})`, "ok");
            } else if (data.status === "error") {
              addLog(`Ошибка: ${data.error}`, "error");
            } else if (data.status === "scanning") {
              addLog("Поиск камеры в сети...", "warn");
            } else if (data.status === "connecting") {
              addLog(`Подключение к ${data.camera_ip}...`);
            }
            lastStatus = data.status;
          }

          // Управляем потоком (не спамим если уже пытаемся)
          if (
            data.status === "streaming" &&
            !streamConnected &&
            !streamStarting &&
            !reconnectTimer
          ) {
            startStream();
          }

          // Оверлей
          updateOverlay(data);
        } catch (e) {
          statusDot.className = "status-dot error";
          statusText.textContent = "· Сервер недоступен";
          footerStatus.textContent =
            "Бэкенд недоступен — автопереподключение...";
          updateOverlay({ status: "backend_down" });
          // Не спамим лог каждую итерацию
          if (Date.now() - lastHealthWarnMs > 15000) {
            addLog("Бэкенд недоступен, повторная попытка...", "error");
            lastHealthWarnMs = Date.now();
          }
        }
      }

      /**
       * Показывает или скрывает оверлей подключения поверх видеопотока.
       * @param {{status: string, error?: string, camera_ip?: string}} data Статус backend-а.
       * @returns {void}
       */
      function updateOverlay(data) {
        // Скрываем оверлей только когда реально есть живой поток
        // (и статус streaming, и картинка подключена, и кадры обновляются)
        const healthy = Date.now() - lastFrameTickMs < 8000;
        if (data.status === "streaming" && streamConnected && healthy) {
          overlay.classList.add("hidden");
          return;
        }
        overlay.classList.remove("hidden");

        const messages = {
          init: ["⏳", "Инициализация", "Запуск бэкенда..."],
          scanning: ["📡", "Поиск камеры", "Сканирование локальной сети..."],
          connecting: [
            "🔌",
            "Подключение",
            `Установка RTSP-соединения с ${data.camera_ip || ""}...`,
          ],
          streaming: ["📺", "Загрузка потока", "Ожидание первого кадра..."],
          error: [
            "⚠️",
            "Ошибка",
            `${data.error || "Нет соединения"}. Автопереподключение...`,
          ],
          backend_down: [
            "🔴",
            "Сервер недоступен",
            "Бэкенд не отвечает. Переподключение каждые 2 сек...",
          ],
        };

        const [icon, title, text] = messages[data.status] || [
          "❓",
          data.status,
          "",
        ];
        overlaySpinner.style.display =
          data.status === "error" || data.status === "backend_down"
            ? "none"
            : "block";
        overlayTitle.textContent = `${icon} ${title}`;
        overlayText.textContent = text;
      }

      // ─── MJPEG поток ─────────────────────────────────────────────────────────────
      let streamStarting = false;

      /**
       * Запускает или перезапускает MJPEG-поток в теге img.
       * @returns {void}
       */
      function startStream() {
        if (streamStarting) return; // не спамить
        streamStarting = true;

        const url = `/stream?cam=${encodeURIComponent(currentCamMode)}&t=${Date.now()}`;
        addLog("Подключение к MJPEG-потоку...");

        // Сбрасываем старые обработчики
        streamImg.onload = null;
        streamImg.onerror = null;

        /**
         * Обрабатывает таймаут первичного подключения MJPEG-потока.
         * @returns {void}
         */
        function handleStreamLoadTimeout() {
          if (!streamConnected) {
            addLog("MJPEG: таймаут загрузки, переподключение...", "warn");
            streamStarting = false;
            streamConnected = false;
            scheduleReconnect();
          }
        }

        // Даём время на подключение — если за 15 сек кадр не пришёл, переподключаем.
        const loadTimeout = setTimeout(handleStreamLoadTimeout, 15000);

        /**
         * Обрабатывает успешное подключение MJPEG-картинки.
         * @returns {void}
         */
        streamImg.onload = function handleStreamLoad() {
          clearTimeout(loadTimeout);
          if (!streamConnected) {
            streamConnected = true;
            streamStarting = false;
            addLog("MJPEG-поток загружен", "ok");
            overlay.classList.add("hidden");
          }
        };

        /**
         * Обрабатывает разрыв MJPEG-потока.
         * @returns {void}
         */
        streamImg.onerror = function handleStreamError() {
          clearTimeout(loadTimeout);
          // Не спамим лог если уже были отключены
          if (streamConnected) {
            addLog("MJPEG-поток прервался", "warn");
          }
          streamConnected = false;
          streamStarting = false;
          overlay.classList.remove("hidden");
          scheduleReconnect();
        };

        streamImg.src = url;
      }

      /**
       * Планирует отложенное переподключение MJPEG-потока.
       * @returns {void}
       */
      function scheduleReconnect() {
        if (reconnectTimer) return;
        /**
         * Выполняет отложенное переподключение потока.
         * @returns {void}
         */
        function reconnectStream() {
          reconnectTimer = null;
          streamConnected = false;
          startStream();
        }

        reconnectTimer = setTimeout(reconnectStream, STREAM_RECONNECT_MS);
      }

      // ─── Кнопки ──────────────────────────────────────────────────────────────────
      /**
       * Скачивает текущий кадр с учётом выбранной области камеры.
       * @returns {void}
       */
      function takeSnapshot() {
        const a = document.createElement("a");
        a.href = `/snapshot?cam=${encodeURIComponent(currentCamMode)}`;
        a.download = `snapshot_${new Date().toISOString().replace(/[:.]/g, "-")}.jpg`;
        a.click();
        addLog("Снимок сохранён");
      }

      /**
       * Переключает полноэкранный режим блока с видеопотоком.
       * @returns {void}
       */
      function toggleFullscreen() {
        const wrap = document.getElementById("streamWrap");
        if (!document.fullscreenElement) {
          /**
           * Игнорирует отказ браузера на ручной fullscreen-запрос.
           * @returns {void}
           */
          function ignoreFullscreenError() {}

          wrap.requestFullscreen().catch(ignoreFullscreenError);
        } else {
          document.exitFullscreen();
        }
      }

      /**
       * Проверяет, запрошен ли fullscreen через URL-параметр.
       * @returns {boolean} true, если параметр fullscreen включён.
       */
      function wantFullscreenFromUrl() {
        try {
          const params = new URLSearchParams(window.location.search || "");
          const v = (params.get("fullscreen") || "").toLowerCase();
          return v === "1" || v === "true" || v === "yes" || v === "on";
        } catch {
          return false;
        }
      }

      /**
       * Пытается включить fullscreen и ждёт жест пользователя при блокировке браузером.
       * @param {string} [reason=""] Причина, которую нужно показать в логе.
       * @returns {Promise<void>}
       */
      async function tryEnterFullscreen(reason = "") {
        const wrap = document.getElementById("streamWrap");
        if (!wrap || document.fullscreenElement) return;
        try {
          await wrap.requestFullscreen();
          addLog("Полный экран включен" + (reason ? ` (${reason})` : ""), "ok");
        } catch (e) {
          // Большинство браузеров блокирует fullscreen без жеста пользователя.
          addLog(
            "Авто fullscreen заблокирован браузером — кликни по странице для полного экрана",
            "warn",
          );
          /**
           * Повторяет fullscreen после первого пользовательского жеста.
           * @returns {void}
           */
          function requestFullscreenOnce() {
            /**
             * Логирует успешное включение fullscreen после жеста пользователя.
             * @returns {void}
             */
            function logFullscreenEnabled() {
              addLog("Полный экран включен", "ok");
            }

            /**
             * Игнорирует повторный отказ браузера на fullscreen.
             * @returns {void}
             */
            function ignoreFullscreenRetryError() {}

            wrap
              .requestFullscreen()
              .then(logFullscreenEnabled)
              .catch(ignoreFullscreenRetryError);
            window.removeEventListener("click", requestFullscreenOnce);
            window.removeEventListener("keydown", requestFullscreenOnce);
          }

          window.addEventListener("click", requestFullscreenOnce);
          window.addEventListener("keydown", requestFullscreenOnce);
        }
      }

      /**
       * Открывает или закрывает панель логов.
       * @returns {void}
       */
      function toggleLog() {
        logPanel.classList.toggle("open");
      }
      // ─── Режим отображения ────────────────────────────────────────────────────
      /**
       * Меняет CSS-режим масштабирования видеопотока.
       * @param {string} mode Режим отображения.
       * @returns {void}
       */
      function setViewMode(mode) {
        const wrap = document.getElementById("streamWrap");
        wrap.className =
          wrap.className.replace(/view-\w+/g, "").trim() + " view-" + mode;
        // Оригинал нужен overflow: auto для прокрутки
        wrap.style.overflow = mode === "original" ? "auto" : "hidden";
        localStorage.setItem("viewMode", mode);
        addLog(
          "Режим: " +
            {
              fit: "Вписать (растянуть)",
              contain: "Пропорционально",
              fill: "Заполнить (обрезка)",
              original: "Оригинал 1:1",
            }[mode],
        );
      }

      /**
       * Меняет область кадра и переподключает поток с новым параметром.
       * @param {string} mode Режим области кадра: full, top или bottom.
       * @returns {void}
       */
      function setCamMode(mode) {
        currentCamMode = mode || "full";
        localStorage.setItem("camMode", currentCamMode);
        // Переподключаем поток, чтобы применить ?cam=...
        streamConnected = false;
        streamStarting = false;
        if (reconnectTimer) {
          clearTimeout(reconnectTimer);
          reconnectTimer = null;
        }
        startStream();
        addLog(
          "Кадр: " +
            {
              full: "Весь кадр",
              top: "Верх",
              bottom: "Низ",
            }[currentCamMode],
        );
      }

      /**
       * Восстанавливает сохранённые настройки отображения из localStorage.
       * @returns {void}
       */
      (function () {
        const saved = localStorage.getItem("viewMode");
        if (saved) {
          document.getElementById("viewMode").value = saved;
          setViewMode(saved);
        }

        const savedCam = localStorage.getItem("camMode");
        if (savedCam) {
          document.getElementById("camMode").value = savedCam;
          currentCamMode = savedCam;
        }
      })();
      // ─── Запуск ──────────────────────────────────────────────────────────────────
      addLog("Stream Viewer запущен");
      pollStatus();
      setInterval(pollStatus, STATUS_POLL_MS);

      // Авто fullscreen по параметру URL (?fullscreen=true)
      if (wantFullscreenFromUrl()) {
        /**
         * Включает fullscreen после первичной отрисовки страницы.
         * @returns {void}
         */
        function enterFullscreenFromUrl() {
          tryEnterFullscreen("URL параметр");
        }

        // Не мешаем первоначальной загрузке DOM.
        setTimeout(enterFullscreenFromUrl, 500);
      }

      /**
       * Проверяет поток при возврате пользователя на вкладку.
       * @returns {void}
       */
      function handleVisibilityChange() {
        if (!document.hidden) {
          addLog("Вкладка активна, проверка потока...");
          pollStatus();
          if (!streamConnected && !streamStarting && !reconnectTimer)
            startStream();
        }
      }

      // Переподключение при возврате на вкладку.
      document.addEventListener("visibilitychange", handleVisibilityChange);
    </script>
  </body>
</html>
